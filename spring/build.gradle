plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.10'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'umc'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

def generatedDir = "src/main/generated"

sourceSets {
	main {
		java {
			srcDirs += generatedDir // Q타입 파일이 생성될 디렉토리 추가
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.annotationProcessorGeneratedSourcesDirectory = file(generatedDir) // 생성된 파일 디렉토리 지정
}

configurations {
	querydsl.extendsFrom compileClasspath
}

dependencies {
	// Spring + DB
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// ✅ QueryDSL 5.x (Jakarta 기반)
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api:2.1.1'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api:3.1.0'

	// Lombok
	compileOnly 'org.projectlombok:lombok:1.18.22'
	annotationProcessor 'org.projectlombok:lombok:1.18.22'

	// 기타
	implementation 'org.hibernate:hibernate-core:6.0.0.Final'
	implementation 'org.springdoc:springdoc-openapi-ui:1.6.9'
	implementation 'org.springdoc:springdoc-openapi-data-rest:1.6.9'

	// JUnit 5 의존성 (spring-boot-starter-test에 포함되어 있으므로 제거)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ✅ QueryDSL 컴파일 설정
tasks.register("compileQuerydsl", JavaCompile) {
	group = "build"
	description = "Compile QueryDSL Q-type sources"

	// QueryDSL에서 생성하는 Q타입 파일만 소스로 지정
	source = sourceSets.main.java

	classpath = sourceSets.main.compileClasspath
	destinationDirectory.set(file(generatedDir)) // 생성된 Q타입 파일은 'generated' 디렉토리로

	options.annotationProcessorGeneratedSourcesDirectory = file(generatedDir)
	options.compilerArgs += ['-proc:only'] // annotation processor만 실행
}

// clean 시 생성된 Q타입 클래스도 삭제
clean {
	delete file(generatedDir)
}

tasks.named('test') {
	useJUnitPlatform()
}
